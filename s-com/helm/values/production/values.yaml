networking:
  - name: service
    serviceEnabled: true
    ingresses:
      - name: service
        ingressEnabled: true
        ipwhitelists:
          - name: sfp-all
            ipwhitelistEnabled: true
            ipSfp: true
            ipSpkProxy: false
            ipSparkassen: false
            ipWhitelistEnabled: true
        pathElements:
          - domain: ragnroll.s-communication.de # Use your domain
            path: /
      - name: internal
        ingressEnabled: true
        ipwhitelists:
          - name: sfp-all
            ipSfp: true
            ipSpkProxy: false
            ipSparkassen: false
            ipWhitelistEnabled: true
        pathElements:
          - domain: ragnroll.s-communication.de # Use your domain
            path: /internal

env:
  NODE_ENV: production
  TAG: ${DOCKER_IMAGE_TAG}
  PROXY_HOST: spkproxy.pixelpark.net
  # RAGFlow-specific environment variables
  DOC_ENGINE: infinity
  MYSQL_HOST: mariadb-service
  REDIS_HOST: redis-service
  MINIO_HOST: minio-service
  INFINITY_HOST: infinity-service
  TZ: Europe/Berlin
  # Default credentials (should be overridden by Kubernetes secrets)
  MYSQL_DBNAME: rag_flow
  MYSQL_USER: ragflow_user
  MINIO_USER: rag_flow
