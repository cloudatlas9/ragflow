networking:
  - name: service
    serviceEnabled: true
    ingresses:
      - name: service
        ingressEnabled: true
        ipwhitelists:
          - name: sfp-all
            ipwhitelistEnabled: true
            ipSfp: true
            ipSpkProxy: false
            ipSparkassen: false
            ipWhitelistEnabled: true
        pathElements:
          - domain: ragnroll-dev.s-communication.de # Development domain
            path: /

env:
  NODE_ENV: development
  TAG: ${DOCKER_IMAGE_TAG}
  # RAGFlow-specific environment variables
  DOC_ENGINE: infinity
  MYSQL_HOST: mariadb-service
  REDIS_HOST: redis-service
  MINIO_HOST: minio-service
  INFINITY_HOST: infinity-service
  TZ: Europe/Berlin
  DEBUG: 1
  # Default credentials (should be overridden by Kubernetes secrets)
  MYSQL_DBNAME: rag_flow_dev
  MYSQL_USER: ragflow_user
  MINIO_USER: rag_flow

# Reduced resources for development
resources:
  limits:
    cpu: 1.000
    memory: 2Gi
  requests:
    cpu: 0.500
    memory: 1Gi
